[build]
  publish = "public"

[[edge_functions]]
  path = "/api/chat"
  function = "chat"

[[headers]]
  for = "/Nemotron-Setup.bat"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment; filename=Nemotron-Setup.bat"

[[edge_functions]]
  path = "/Nemotron-Setup.bat"
  function = "setup-bat"
